# =============================================================================
# ~/.tmux.conf
# =============================================================================

# -----------------------------------------------------------------------------
# General
# -----------------------------------------------------------------------------
# Use 256 colors / true color
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",tmux-256color:RGB"

# Start windows and panes at 1, not 0 (matches keyboard top row)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Faster escape sequence recognition (fixes ESC lag in vim)
set -sg escape-time 10

# Focus events (needed for some vim/nvim plugins)
set -g focus-events on

# Allow terminal applications to set the window title
set -g set-titles on
set -g set-titles-string "#S:#I:#W - #T"

# History
set -g history-limit 50000

# Automatically reload config when saved
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# -----------------------------------------------------------------------------
# Prefix key: use Ctrl-a instead of Ctrl-b
# -----------------------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# -----------------------------------------------------------------------------
# Splits: more intuitive keys
# -----------------------------------------------------------------------------
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# -----------------------------------------------------------------------------
# Pane navigation with vim-style keys
# -----------------------------------------------------------------------------
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with repeatable keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Resize panes with arrow keys (repeatable)
bind -r Left  resize-pane -L 5
bind -r Down  resize-pane -D 5
bind -r Up    resize-pane -U 5
bind -r Right resize-pane -R 5

# Swap panes
bind -r '<' swap-pane -U
bind -r '>' swap-pane -D

# Kill pane without confirmation
bind x kill-pane

# -----------------------------------------------------------------------------
# Window navigation
# -----------------------------------------------------------------------------
bind -r Tab next-window
bind -r BTab previous-window
bind -r n next-window
bind -r p previous-window

# Move window left/right
bind -r C-S-Left  swap-window -t -1
bind -r C-S-Right swap-window -t +1

# -----------------------------------------------------------------------------
# Copy mode (vi-style)
# -----------------------------------------------------------------------------
setw -g mode-keys vi

bind Enter copy-mode

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi Escape send-keys -X cancel

# -----------------------------------------------------------------------------
# Status bar
# -----------------------------------------------------------------------------
set -g status-interval 5
set -g status-position bottom
set -g status-style "fg=colour250,bg=colour236"
set -g status-left-length 40
set -g status-right-length 80

set -g status-left "#[fg=colour232,bg=colour110,bold] #S #[fg=colour110,bg=colour236,nobold] "
set -g status-right "#[fg=colour245]#{?client_prefix,#[fg=colour214]PREFIX ,}#[fg=colour245]%Y-%m-%d %H:%M #[fg=colour110,bg=colour236,bold] #h "

setw -g window-status-format         " #I:#W "
setw -g window-status-current-format "#[fg=colour232,bg=colour110,bold] #I:#W#[fg=colour110,bg=colour236,nobold] "
setw -g window-status-separator ""

set -g pane-border-style        "fg=colour238"
set -g pane-active-border-style "fg=colour110"

# -----------------------------------------------------------------------------
# Messages & display
# -----------------------------------------------------------------------------
set -g message-style "fg=colour232,bg=colour110"
set -g display-time 2000

# -----------------------------------------------------------------------------
# Mouse support
# -----------------------------------------------------------------------------
set -g mouse on

# -----------------------------------------------------------------------------
# Activity / bell
# -----------------------------------------------------------------------------
setw -g monitor-activity on
set -g visual-activity off
setw -g monitor-bell on
set -g visual-bell off

# -----------------------------------------------------------------------------
# Miscellaneous
# -----------------------------------------------------------------------------
# Prevent tmux from renaming windows automatically
setw -g automatic-rename on
setw -g automatic-rename-format "#{b:pane_current_path}"

# Don't exit copy mode on scroll (nice for mouse users)
bind -T copy-mode-vi WheelUpPane   send-keys -X -N 3 scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X -N 3 scroll-down

# Reload from within any pane (tmux 3.2+)
set -g allow-rename off

# -----------------------------------------------------------------------------
# Plugin manager (optional — tmux plugin manager / TPM)
# -----------------------------------------------------------------------------
# Uncomment after installing TPM: https://github.com/tmux-plugins/tpm
#
# set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-continuum'
# set -g @continuum-restore 'on'
# run '~/.tmux/plugins/tpm/tpm'